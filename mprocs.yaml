procs:
  plugin:
    shell: "cd plugin && npm i && npm run dev"
  server:
    shell: "cd server && bun i && bun run dev"
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5433/dev_db"
  tests:
    shell: "cd server && bun test --watch"
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5434/test_db"
      OBJECT_STORE_DIR: "test_object_store"
  db:
    shell: "./db_setup.sh"
  pluginmove:
    shell: "./plugin/movestuff.py"
  tunnel:
    shell: "./server/tunnel.py"
  rainfrog:
    shell: "sleep 2 && rainfrog --url postgres://postgres:postgres@localhost:5433/dev_db"
  

