name: Tests

on:
  push:
    branches: [diy-object-store]
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-unit:
    name: Plugin unit (bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            shared/protocol/package-lock.json
      - name: Install protocol deps
        working-directory: shared/protocol
        run: npm ci
      - name: Test shared protocol
        working-directory: shared/protocol
        run: npm test
      - run: npm ci
      - run: bun test src

  server-unit:
    name: Server unit (bun + postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5434/test_db
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install protocol deps
        working-directory: shared/protocol
        run: |
          npm ci
          # bun resolves the file: protocol package from server/
      - name: Build client-package plugin artifacts
        working-directory: plugin
        run: |
          npm ci
          npm run build
      - run: bun install
      - run: bun test

  obsidian-e2e:
    name: Obsidian e2e (CLI + docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CONTAINER_BIN: docker
      E2E_SKIP_COMPOSE: "1"
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5434/test_db
      E2E_HOST_GATEWAY: host.docker.internal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            shared/protocol/package-lock.json
      - name: Install protocol + plugin deps
        run: |
          npm ci --prefix shared/protocol
          npm ci --prefix plugin
          bun install --cwd server
          bun install --cwd e2e
      - name: Pull Obsidian image
        run: docker pull lscr.io/linuxserver/obsidian:latest
      - name: Run Obsidian e2e
        working-directory: e2e
        run: bun test tests/obsidian
      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-run-logs
          path: e2e/.run/
          if-no-files-found: ignore

  server-container:
    name: Server container (docker + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: obsidian-sync-engine:test
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image
      - name: Smoke test server image
        run: |
          docker run --detach --name sync-server --network host \
            --env DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5434/test_db \
            obsidian-sync-engine:test
          trap 'docker logs sync-server; docker rm --force sync-server' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
