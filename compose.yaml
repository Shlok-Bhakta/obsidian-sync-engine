services:
  # connection string: postgres://postgres:postgres@localhost:5433/dev_db
  dev-db:
    image: postgres:18-alpine
    container_name: dev-db
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    # volumes:
    #   - ./dev-db-data:/var/lib/postgresql/data

  # connection string: postgres://postgres:postgres@localhost:5434/test_db
  test-db:
    image: postgres:18-alpine
    container_name: test-db
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    # volumes:
    #   - ./test-db-data:/var/lib/postgresql/data
